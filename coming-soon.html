<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — Edinburgh University Boat Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #000000;
      --accent: #99d6ea;
      --white:  #FFFFFF;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Trajan Pro', 'Trajan', 'Cinzel', Georgia, serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
      background: rgba(0,0,0,0.85);
    }

    .nav-logo {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
    }

    /* ── PAGE ── */
    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      background:
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(153,214,234,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(153,214,234,0.04) 0%, transparent 70%),
        #000;
    }

    .crest {
      width: clamp(90px, 14vw, 160px);
      opacity: 0.82;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.6));
      margin-bottom: 3rem;
    }

    .label {
      font-size: 0.68rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      opacity: 0.85;
    }

    .heading {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1.15;
      color: var(--white);
      margin-bottom: 0.4rem;
    }

    .heading span {
      display: block;
      font-style: italic;
      color: var(--white);
    }

    .rule {
      width: 48px;
      height: 1.5px;
      background: var(--accent);
      margin: 1.8rem auto;
      opacity: 0.75;
    }

    .sub {
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      max-width: 320px;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      border-bottom: 1px solid rgba(153,214,234,0.25);
      padding-bottom: 0.25rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-link::before { content: '←'; }
    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @media (max-width: 640px) {
      nav { padding: 1rem 1.25rem; }
      .page { padding: 5rem 1.25rem 6rem; }
      .crest { margin-bottom: 2.2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">EUBC</a>
  </nav>

  <main class="page">
    <img src="EUBC_Logo(notext).png" class="crest" alt="Edinburgh University Boat Club" />
    <p class="label">Edinburgh University Boat Club</p>
    <h1 class="heading">Coming<br /><span>Soon</span></h1>
    <div class="rule"></div>
    <p class="sub">This page is under construction.<br />Check back shortly.</p>
    <a class="back-link" href="index.html">Back to Home</a>
  </main>

</body>
</html>
