<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edinburgh University Boat Club</title>
  <!-- Paint the hero instantly with a poster while the video streams in -->
  <link rel="preload" as="image" href="images/hero-poster.jpg" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #000000;
      --accent: #99d6ea;
      --white:  #FFFFFF;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Trajan Pro', 'Trajan', 'Cinzel', Georgia, serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 3rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      transition: background 0.4s;
    }
    nav.scrolled { background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.75) 100%); }

    .nav-logo {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.5) 0%,
        rgba(0,0,0,0.25) 45%,
        rgba(0,0,0,0.6) 100%
      );
    }

    /* Logo — pinned to true centre of hero */
    .hero-logo-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .eubc-logo {
      width: clamp(140px, 20vw, 260px);
      opacity: 0.88;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.55));
      display: block;
    }

    /* Text — anchored to lower portion of hero */
    .hero-content {
      position: absolute;
      bottom: 13%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 1.5rem;
      width: 100%;
    }

    .hero-title {
      font-size: clamp(2rem, 5.5vw, 4.4rem);
      font-weight: 400;
      line-height: 1.14;
      letter-spacing: 0.05em;
      color: var(--white);
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .hero-title span {
      display: block;
      color: var(--white);
      font-style: italic;
    }

    .hero-rule {
      width: 52px;
      height: 1.5px;
      background: var(--accent);
      margin: 1.6rem auto;
      opacity: 0.85;
    }

    .hero-sub {
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }

    /* ── SCROLL HINT ── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      animation: hintFade 2s ease 1.2s both;
    }

    .scroll-hint-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .scroll-arrow {
      width: 16px;
      height: 16px;
      border-right: 1.5px solid rgba(255,255,255,0.4);
      border-bottom: 1.5px solid rgba(255,255,255,0.4);
      transform: rotate(45deg);
      animation: bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.4; }
      50%       { transform: rotate(45deg) translateY(5px); opacity: 0.8; }
    }

    @keyframes hintFade {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── LINKS SECTION ── */
    .links-section {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(153,214,234,0.13) 0%, transparent 70%),
        linear-gradient(to bottom, #000 0%, #020a0e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 8rem;
      gap: 6rem;
    }

    .main-btns {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 1px;
      width: 100%;
      max-width: 1040px;
      background: rgba(153,214,234,0.15);
    }

    .main-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 3.2rem 1.5rem;
      background: #000;
      border-top: 2px solid rgba(153,214,234,0.5);
      color: var(--white);
      text-decoration: none;
      font-size: clamp(0.75rem, 1.4vw, 0.95rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    .main-btn::after {
      content: '→';
      font-size: 1rem;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s, transform 0.3s;
      color: var(--accent);
    }

    .main-btn:hover {
      background: rgba(153,214,234,0.07);
      color: var(--accent);
      border-color: var(--accent);
    }
    .main-btn:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    /* partner logos */
    .partner-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5rem;
      flex-wrap: wrap;
    }

    .partner-logo {
      height: 58px;
      width: auto;
      filter: invert(1);
      opacity: 0.55;
      transition: opacity 0.25s;
    }
    .partner-logo:hover { opacity: 0.9; }

    /* ── SCROLL REVEAL ── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition:
        opacity  0.75s ease var(--delay, 0s),
        transform 0.75s ease var(--delay, 0s);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      /* Nav */
      nav { padding: 1rem 1.25rem; }
      .nav-links { display: none; }

      /* Hero — use svh so the browser chrome doesn't clip the content */
      .hero {
        height: 100vh;
        height: 100svh;
      }
      .eubc-logo { width: clamp(110px, 34vw, 170px); }
      .hero-content {
        bottom: 10%;
        padding: 0 1.25rem;
      }
      .hero-title {
        font-size: clamp(1.3rem, 5.5vw, 2rem);
        letter-spacing: 0.03em;
      }
      .hero-rule { margin: 1rem auto; }
      .hero-sub {
        font-size: 0.62rem;
        letter-spacing: 0.12em;
      }

      /* Links section */
      .links-section {
        min-height: 100vh;
        min-height: 100svh;
        gap: 3.5rem;
        padding: 5rem 1.25rem 6rem;
      }

      /* Buttons — horizontal label + arrow row on mobile */
      .main-btns {
        flex-direction: column;
        max-width: 100%;
      }
      .main-btn {
        flex-direction: row;
        justify-content: space-between;
        padding: 1.4rem 1.25rem;
        font-size: 0.82rem;
        letter-spacing: 0.2em;
      }
      /* Arrow always visible on mobile (no hover state on touch) */
      .main-btn::after {
        opacity: 0.45;
        transform: translateX(0);
      }

      /* Partner logos — stack vertically, full width centered */
      .partner-logos {
        flex-direction: column;
        gap: 2.2rem;
      }
      .partner-logo { height: 38px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a class="nav-logo" href="#">EUBC</a>
    <ul class="nav-links">
      <li><a href="row-with-us.html">Row With Us</a></li>
      <li><a href="coming-soon.html">Alumni</a></li>
      <li><a href="coming-soon.html">News</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <video id="hero-video" autoplay muted loop playsinline webkit-playsinline
           preload="auto" poster="images/hero-poster.jpg">
      <source src="images/hero.mp4" type="video/mp4" />
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-logo-wrap">
      <img src="images/EUBC_Logo(notext).png" class="eubc-logo" alt="Edinburgh University Boat Club Crest" />
    </div>
    <div class="hero-content">
      <h1 class="hero-title">
        Edinburgh University<br /><span>Boat Club</span>
      </h1>
      <div class="hero-rule"></div>
      <p class="hero-sub">Est. 1867 &middot; Scotland</p>
    </div>
    <div class="scroll-hint">
      <span class="scroll-hint-label">Scroll</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- LINKS -->
  <section class="links-section" id="links">
    <div class="main-btns">
      <a class="main-btn reveal" href="row-with-us.html" style="--delay: 0s">Row With Us</a>
      <a class="main-btn reveal" href="coming-soon.html" style="--delay: 0.12s">Alumni</a>
      <a class="main-btn reveal" href="coming-soon.html" style="--delay: 0.24s">News</a>
    </div>
    <div class="partner-logos reveal" style="--delay: 0.4s">
      <img class="partner-logo" src="images/Sports Union Black.png" alt="Edinburgh University Sports Union" />
      <img class="partner-logo" src="images/UOE Sport - Hero logo horizontal - Black - @2x.png" alt="UOE Sport" />
    </div>
  </section>

  <script>
    // Force video play on iOS (Low Power Mode / strict autoplay policy)
    const video = document.getElementById('hero-video');
    const tryPlay = () => video.play().catch(() => {});
    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true });
    document.addEventListener('scroll', tryPlay, { once: true, passive: true });

    // Nav solid on scroll
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    // Scroll reveal via IntersectionObserver
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
