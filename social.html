<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media Planner — Edinburgh University Boat Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app/eubc.css" />
  <link rel="stylesheet" href="app/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app/config.js"></script>
  <script src="app/supabase.js"></script>
</head>
<body>

<!-- ══════════════════════════════════════
     GATE
══════════════════════════════════════ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <img src="images/EUBC_Logo(notext).png" class="crest" alt="EUBC Crest" />
    <h1>Social</h1>
    <div class="field">
      <input type="password" id="gate-pw" placeholder="Password" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="gate-btn">Enter</button>
    <div class="msg err" id="gate-err"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     APP
══════════════════════════════════════ -->
<div id="app">
  <nav>
    <a href="admin.html" class="nav-logo">EUBC · Social</a>
    <div class="nav-right">
      <a href="admin.html" class="btn btn-ghost">Admin home</a>
      <button class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </nav>

  <section class="panel active" id="panel-social">

    <div class="cal-toolbar">
      <button class="btn btn-sm" id="cal-prev">‹ Prev</button>
      <div class="cal-title" id="cal-title">—</div>
      <button class="btn btn-sm" id="cal-next">Next ›</button>
      <button class="btn btn-sm btn-ghost" id="cal-today">Today</button>
      <div style="flex:1;"></div>
      <button class="btn btn-sm" id="add-keydate-btn">+ Key date</button>
    </div>

    <div class="cal-grid" id="cal-grid"></div>
    <div class="msg" id="social-msg"></div>

    <div class="section-head">Upcoming posts</div>
    <div style="overflow-x:auto;">
      <table class="roster" id="agenda-table">
        <thead>
          <tr>
            <th>Date</th><th>Post</th><th>Responsible</th><th>Platform</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="agenda-body"></tbody>
      </table>
    </div>

    <div class="section-head">Key dates</div>
    <div style="overflow-x:auto;">
      <table class="roster" id="keydates-table">
        <thead>
          <tr><th>Label</th><th>From</th><th>To</th><th>Type</th><th></th></tr>
        </thead>
        <tbody id="keydates-body"></tbody>
      </table>
    </div>

  </section>

  <!-- ── Post editor modal ── -->
  <div class="modal-overlay" id="post-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="post-modal-title">New post</div>
        <button class="btn btn-sm btn-ghost" id="post-cancel">✕</button>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="post-date" />
      </div>
      <div class="field">
        <label>Post / description</label>
        <input type="text" id="post-title" placeholder="e.g. Race day recap reel" autocomplete="off" />
      </div>
      <div class="field">
        <label>Responsible</label>
        <input type="text" id="post-responsible" placeholder="Name" autocomplete="off" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Platform</label>
          <select id="post-platform">
            <option value="">—</option>
            <option>Instagram</option>
            <option>TikTok</option>
            <option>Facebook</option>
            <option>X</option>
            <option>YouTube</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select id="post-status">
            <option value="idea">Idea</option>
            <option value="drafting">Drafting</option>
            <option value="scheduled">Scheduled</option>
            <option value="posted">Posted</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Notes / caption</label>
        <textarea id="post-notes" placeholder="Draft caption, links, details…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-sm btn-danger" id="post-delete" hidden>Delete</button>
        <div class="spacer"></div>
        <button class="btn btn-sm btn-ghost" id="post-cancel-2">Cancel</button>
        <button class="btn btn-sm btn-primary" id="post-save">Save</button>
      </div>
      <div class="msg" id="post-msg"></div>
    </div>
  </div>

  <!-- ── Key-date editor modal ── -->
  <div class="modal-overlay" id="keydate-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Add key date</div>
        <button class="btn btn-sm btn-ghost" id="keydate-cancel">✕</button>
      </div>
      <div class="field">
        <label>Label</label>
        <input type="text" id="keydate-label" placeholder="e.g. Scottish Champs / Media officer away" autocomplete="off" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>From</label>
          <input type="date" id="keydate-start" />
        </div>
        <div class="field">
          <label>To (optional)</label>
          <input type="date" id="keydate-end" />
        </div>
      </div>
      <div class="field">
        <label>Highlight colour</label>
        <input type="color" id="keydate-colour" value="#99d6ea" style="width:48px;height:32px;padding:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;" />
      </div>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button class="btn btn-sm btn-ghost" id="keydate-cancel-2">Cancel</button>
        <button class="btn btn-sm btn-primary" id="keydate-save">Save</button>
      </div>
      <div class="msg" id="keydate-msg"></div>
    </div>
  </div>
</div><!-- /#app -->

<script>
// ── Helpers ────────────────────────────────────────────
function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg show' + (type ? ' ' + type : '');
  if (type === 'ok') {
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove('show'); }, 4000);
  }
}

function parseDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return new Date(y, m - 1, day);
}

function fmtDateCol(d) {
  const dt = parseDate(d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(dt.getDate()).padStart(2, '0') + '-' + months[dt.getMonth()];
}

// ── Gate / auth ────────────────────────────────────────
async function checkAuth() {
  try {
    const session = await window.EUBC.getSession();
    if (!session) { showGate(); return; }
    const role = await window.EUBC.getRole();
    if (role !== 'admin') { showGate(); return; }
    showApp();
  } catch (e) {
    showGate();
  }
}

function showGate() {
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadSocial();
}

document.getElementById('gate-btn').addEventListener('click', doLogin);
document.getElementById('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw = document.getElementById('gate-pw').value.trim();
  const errEl = document.getElementById('gate-err');
  if (!pw) { showMsg(errEl, 'Please enter a password.', 'err'); return; }
  try {
    await window.EUBC.signIn('admin', pw);
    const role = await window.EUBC.getRole();
    if (role !== 'admin') {
      await window.EUBC.signOut();
      showMsg(errEl, 'Access denied — not an admin account.', 'err');
      return;
    }
    showApp();
  } catch (e) {
    showMsg(errEl, e.message || 'Login failed.', 'err');
  }
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  try { await window.EUBC.signOut(); } catch (_) {}
  showGate();
});

// ═══════════════════════════════════════════════════════
//  SOCIAL MEDIA PLANNER
// ═══════════════════════════════════════════════════════

const social = {
  month: (function () { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })(),
  posts: [],
  keyDates: [],
  editingPostId: null,
};

const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];

// yyyy-mm-dd for a Date (local, not UTC).
function isoDate(dt) {
  return dt.getFullYear() + '-' +
    String(dt.getMonth() + 1).padStart(2, '0') + '-' +
    String(dt.getDate()).padStart(2, '0');
}

function todayIso() { return isoDate(new Date()); }

// Monday-start grid: how many leading blanks before the 1st.
function leadingBlanks(year, month) {
  const dow = new Date(year, month, 1).getDay(); // 0=Sun
  return (dow + 6) % 7; // Mon=0 … Sun=6
}

async function loadSocial() {
  const grid = document.getElementById('cal-grid');
  const y = social.month.getFullYear();
  const m = social.month.getMonth();
  // Fetch a window that covers the visible grid (prev/next month spillover).
  const from = isoDate(new Date(y, m, 1 - leadingBlanks(y, m)));
  const to = isoDate(new Date(y, m + 1, 14));
  try {
    const [posts, keyDates] = await Promise.all([
      window.EUBC.listSocialPosts({ from, to: isoDate(new Date(y, m + 1, 0)) }),
      window.EUBC.listKeyDates(),
    ]);
    social.posts = posts || [];
    social.keyDates = keyDates || [];
  } catch (e) {
    showMsg(document.getElementById('social-msg'), 'Could not load: ' + (e.message || e), 'err');
    return;
  }
  renderCalendar();
  renderAgenda();
  renderKeyDates();
}

function keyDatesOn(iso) {
  return social.keyDates.filter(k => {
    const end = k.end_date || k.start_date;
    return iso >= k.start_date && iso <= end;
  });
}

function renderCalendar() {
  const y = social.month.getFullYear();
  const m = social.month.getMonth();
  document.getElementById('cal-title').textContent = MONTH_NAMES[m] + ' ' + y;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-dow';
    h.textContent = d;
    grid.appendChild(h);
  });

  const lead = leadingBlanks(y, m);
  const start = new Date(y, m, 1 - lead);
  const today = todayIso();

  // Group posts by date for quick lookup.
  const byDate = {};
  social.posts.forEach(p => { (byDate[p.post_date] = byDate[p.post_date] || []).push(p); });

  for (let i = 0; i < 42; i++) {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const iso = isoDate(dt);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (dt.getMonth() !== m) cell.classList.add('other-month');
    if (iso === today) cell.classList.add('today');
    cell.addEventListener('click', () => openPostModal(iso));

    const num = document.createElement('div');
    num.className = 'cal-daynum';
    num.textContent = dt.getDate();
    cell.appendChild(num);

    // Key-date highlight bars.
    keyDatesOn(iso).forEach(k => {
      const bar = document.createElement('div');
      bar.className = 'cal-keybar';
      bar.style.background = k.colour || 'var(--accent)';
      bar.textContent = k.label;
      bar.title = k.label;
      cell.appendChild(bar);
    });

    // Post chips (cap at 3, then "+N more").
    const dayPosts = byDate[iso] || [];
    dayPosts.slice(0, 3).forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'cal-chip status-' + p.status;
      chip.textContent = (p.platform ? p.platform[0] + '· ' : '') + p.title;
      chip.title = p.title + (p.responsible ? ' — ' + p.responsible : '');
      chip.addEventListener('click', (e) => { e.stopPropagation(); openPostModal(iso, p); });
      cell.appendChild(chip);
    });
    if (dayPosts.length > 3) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = '+' + (dayPosts.length - 3) + ' more';
      cell.appendChild(more);
    }

    grid.appendChild(cell);
  }
}

function renderAgenda() {
  const body = document.getElementById('agenda-body');
  body.innerHTML = '';
  const today = todayIso();
  const upcoming = social.posts
    .filter(p => p.post_date >= today)
    .sort((a, b) => a.post_date.localeCompare(b.post_date));

  if (!upcoming.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.style.color = 'var(--muted)';
    td.textContent = 'No upcoming posts in this month.';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  upcoming.forEach(p => {
    const tr = document.createElement('tr');
    const cells = [
      fmtDateCol(p.post_date),
      p.title,
      p.responsible || '',
      p.platform || '',
    ];
    cells.forEach(txt => {
      const td = document.createElement('td');
      td.textContent = txt;
      tr.appendChild(td);
    });
    const statusTd = document.createElement('td');
    const pill = document.createElement('span');
    pill.className = 'pill status-' + p.status;
    pill.textContent = p.status;
    statusTd.appendChild(pill);
    tr.appendChild(statusTd);

    const actTd = document.createElement('td');
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-sm btn-ghost';
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', () => openPostModal(p.post_date, p));
    actTd.appendChild(editBtn);
    tr.appendChild(actTd);

    body.appendChild(tr);
  });
}

function renderKeyDates() {
  const body = document.getElementById('keydates-body');
  body.innerHTML = '';
  social.keyDates.forEach(k => {
    const tr = document.createElement('tr');

    const labelTd = document.createElement('td');
    const sw = document.createElement('span');
    sw.className = 'colour-swatch';
    sw.style.background = k.colour || 'var(--accent)';
    labelTd.appendChild(sw);
    labelTd.appendChild(document.createTextNode(' ' + k.label));
    tr.appendChild(labelTd);

    [fmtDateCol(k.start_date), k.end_date ? fmtDateCol(k.end_date) : '—', k.category]
      .forEach(txt => {
        const td = document.createElement('td');
        td.textContent = txt;
        tr.appendChild(td);
      });

    const actTd = document.createElement('td');
    const del = document.createElement('button');
    del.className = 'btn btn-sm btn-danger';
    del.textContent = 'Delete';
    del.addEventListener('click', async () => {
      if (!confirm('Delete key date "' + k.label + '"?')) return;
      try {
        await window.EUBC.deleteKeyDate(k.id);
        await loadSocial();
      } catch (e) {
        showMsg(document.getElementById('social-msg'), 'Error: ' + (e.message || e), 'err');
      }
    });
    actTd.appendChild(del);
    tr.appendChild(actTd);

    body.appendChild(tr);
  });
}

// ── Calendar navigation ─────────────────────────────────
document.getElementById('cal-prev').addEventListener('click', () => {
  social.month = new Date(social.month.getFullYear(), social.month.getMonth() - 1, 1);
  loadSocial();
});
document.getElementById('cal-next').addEventListener('click', () => {
  social.month = new Date(social.month.getFullYear(), social.month.getMonth() + 1, 1);
  loadSocial();
});
document.getElementById('cal-today').addEventListener('click', () => {
  const n = new Date();
  social.month = new Date(n.getFullYear(), n.getMonth(), 1);
  loadSocial();
});

// ── Post modal ──────────────────────────────────────────
function openPostModal(iso, post) {
  social.editingPostId = post ? post.id : null;
  document.getElementById('post-modal-title').textContent = post ? 'Edit post' : 'New post';
  document.getElementById('post-date').value = post ? post.post_date : iso;
  document.getElementById('post-title').value = post ? post.title : '';
  document.getElementById('post-responsible').value = post ? (post.responsible || '') : '';
  document.getElementById('post-platform').value = post ? (post.platform || '') : '';
  document.getElementById('post-status').value = post ? post.status : 'idea';
  document.getElementById('post-notes').value = post ? (post.notes || '') : '';
  document.getElementById('post-delete').hidden = !post;
  document.getElementById('post-msg').className = 'msg';
  document.getElementById('post-modal').hidden = false;
  document.getElementById('post-title').focus();
}

function closePostModal() {
  document.getElementById('post-modal').hidden = true;
  social.editingPostId = null;
}

document.getElementById('post-cancel').addEventListener('click', closePostModal);
document.getElementById('post-cancel-2').addEventListener('click', closePostModal);
document.getElementById('post-modal').addEventListener('click', (e) => {
  if (e.target.id === 'post-modal') closePostModal();
});

document.getElementById('post-save').addEventListener('click', async () => {
  const msgEl = document.getElementById('post-msg');
  const title = document.getElementById('post-title').value.trim();
  const date = document.getElementById('post-date').value;
  if (!date) { showMsg(msgEl, 'Please choose a date.', 'err'); return; }
  if (!title) { showMsg(msgEl, 'Please enter what the post is.', 'err'); return; }
  const post = {
    post_date: date,
    title,
    responsible: document.getElementById('post-responsible').value.trim() || null,
    platform: document.getElementById('post-platform').value || null,
    status: document.getElementById('post-status').value,
    notes: document.getElementById('post-notes').value.trim() || null,
  };
  if (social.editingPostId) post.id = social.editingPostId;
  try {
    await window.EUBC.upsertSocialPost(post);
    closePostModal();
    await loadSocial();
  } catch (e) {
    showMsg(msgEl, 'Error: ' + (e.message || e), 'err');
  }
});

document.getElementById('post-delete').addEventListener('click', async () => {
  if (!social.editingPostId) return;
  if (!confirm('Delete this post?')) return;
  try {
    await window.EUBC.deleteSocialPost(social.editingPostId);
    closePostModal();
    await loadSocial();
  } catch (e) {
    showMsg(document.getElementById('post-msg'), 'Error: ' + (e.message || e), 'err');
  }
});

// ── Key-date modal ──────────────────────────────────────
function openKeyDateModal() {
  document.getElementById('keydate-label').value = '';
  document.getElementById('keydate-start').value = '';
  document.getElementById('keydate-end').value = '';
  document.getElementById('keydate-colour').value = '#99d6ea';
  document.getElementById('keydate-msg').className = 'msg';
  document.getElementById('keydate-modal').hidden = false;
  document.getElementById('keydate-label').focus();
}

function closeKeyDateModal() {
  document.getElementById('keydate-modal').hidden = true;
}

document.getElementById('add-keydate-btn').addEventListener('click', openKeyDateModal);
document.getElementById('keydate-cancel').addEventListener('click', closeKeyDateModal);
document.getElementById('keydate-cancel-2').addEventListener('click', closeKeyDateModal);
document.getElementById('keydate-modal').addEventListener('click', (e) => {
  if (e.target.id === 'keydate-modal') closeKeyDateModal();
});

document.getElementById('keydate-save').addEventListener('click', async () => {
  const msgEl = document.getElementById('keydate-msg');
  const label = document.getElementById('keydate-label').value.trim();
  const start = document.getElementById('keydate-start').value;
  const end = document.getElementById('keydate-end').value;
  if (!label) { showMsg(msgEl, 'Please enter a label.', 'err'); return; }
  if (!start) { showMsg(msgEl, 'Please choose a start date.', 'err'); return; }
  if (end && end < start) { showMsg(msgEl, 'End date is before start date.', 'err'); return; }
  try {
    await window.EUBC.upsertKeyDate({
      label,
      start_date: start,
      end_date: end || null,
      category: 'custom',
      colour: document.getElementById('keydate-colour').value,
    });
    closeKeyDateModal();
    await loadSocial();
  } catch (e) {
    showMsg(msgEl, 'Error: ' + (e.message || e), 'err');
  }
});

// ── Boot ────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
